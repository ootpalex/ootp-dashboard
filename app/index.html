<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSB GM Dashboard</title>
    <!-- Kick off the league-registry fetch before React mounts; App.jsx
         requests the same URL with default (cors) mode + no credentials,
         matching this preload so the browser can reuse it. -->
    <link rel="preload" href="/data/leagues.json" as="fetch" crossorigin />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0c1222; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
